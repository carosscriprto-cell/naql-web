name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual re-runs — needed for the B3 five-green-runs merge gate

jobs:
  # Decide which suites need to run based on what changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.ts'
              - '.github/workflows/ci.yml'
            db:
              - 'supabase/**'
              - 'tests/db/**'
              - 'vitest.db.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # Backend suite runs against the FULL LOCAL stack (runners have Docker).
  # This is the concurrency merge gate from B3 — authoritative, not the hosted dev project.
  db:
    needs: changes
    if: ${{ needs.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1 # pinned to match package.json devDependency (config keys validated against this)

      # Fast fail: a config.toml typo (e.g. an unsupported [auth.email] key) should
      # cost seconds here, not a full stack boot. `supabase status` strict-decodes
      # config.toml before touching Docker, so a parse error surfaces immediately.
      # We ignore the expected "stack not running" result and fail ONLY on a parse error.
      - name: Validate config.toml parses
        run: |
          supabase status > config-check.log 2>&1 || true
          if grep -q "failed to parse config" config-check.log; then
            echo "::error::supabase/config.toml failed to parse:"
            cat config-check.log
            exit 1
          fi
          echo "config.toml parsed OK (a 'not running' / Docker message here is expected)."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start local Supabase stack
        run: supabase start

      # Diagnostic: confirm GoTrue got the intended auth flags (email login on,
      # signup allowed, anonymous on). Container name is supabase_auth_<project_id>
      # (project_id = "naql-db"). Non-fatal — never gate the suite on a debug probe.
      - name: Debug GoTrue config
        run: docker exec supabase_auth_naql-db env | grep -i "EXTERNAL_EMAIL\|DISABLE_SIGNUP\|ANONYMOUS" || true

      - name: Apply all migrations + seed from zero
        run: supabase db reset

      # helpers.ts reads SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY.
      # `supabase status -o env` emits API_URL / ANON_KEY / SERVICE_ROLE_KEY by default,
      # so the names are overridden here. tee prints them to the log for diagnosis —
      # these are throwaway local-stack keys, not secrets.
      - name: Export local stack credentials
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' \
            | tee -a "$GITHUB_ENV"

      - name: Verify credentials
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is empty"; exit 1; }
          case "$SUPABASE_URL" in http*) ;; *) echo "Bad SUPABASE_URL: [$SUPABASE_URL]"; exit 1 ;; esac
          echo "SUPABASE_URL=$SUPABASE_URL"
      # Seeded accounts — these values are duplicated in supabase/seed.sql.
      # Changing them there requires the same edit here.
      - name: Run DB tests
        env:
          TEST_OPERATOR_EMAIL: operator.amana@naql.dev
          TEST_OPERATOR_PASSWORD: Password123!
          TEST_ADMIN_EMAIL: admin@naql.dev
          TEST_ADMIN_PASSWORD: Password123!
        run: npm run db:test

      - name: Generated types are committed and fresh
        run: |
          supabase gen types typescript --local > /tmp/types.gen.ts
          # `--local` and `--linked` differ structurally: the hosted generator emits an
          # __InternalSupabase.PostgrestVersion block and a different trailing newline.
          # Compare the schema content only.
          norm() {
            sed '/__InternalSupabase: {/,/^  }$/d' "$1" \
              | sed '/Allows to automatically instantiate createClient/d' \
              | sed '/instead of createClient<Database/d' \
              | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba'
          }
          norm src/types/database.ts > /tmp/committed.norm
          norm /tmp/types.gen.ts     > /tmp/generated.norm
          diff -u /tmp/committed.norm /tmp/generated.norm

      - name: Stop stack
        if: always()
        run: supabase stop