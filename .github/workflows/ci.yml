name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Decide which suites need to run based on what changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.ts'
            db:
              - 'supabase/**'
              - 'tests/db/**'
              - 'vitest.db.config.ts'
              - 'package.json'
              - 'package-lock.json'

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # Backend suite runs against the FULL LOCAL stack (runners have Docker).
  # This is the concurrency merge gate from B3 — authoritative, not the hosted dev project.
  db:
    needs: changes
    if: ${{ needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply all migrations + seed from zero
        run: supabase db reset
      - name: Export local stack credentials
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | tee -a "$GITHUB_ENV"
      - name: Run DB tests
        run: npm run db:test
      - name: Generated types are committed and fresh
        run: |
          supabase gen types typescript --local > src/types/database.ts
          git diff --exit-code src/types/
      - name: Stop stack
        if: always()
        run: supabase stop
