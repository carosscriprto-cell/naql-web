name: DB migrate (manual)

# Applies pending migrations to a hosted project from a runner, because the
# session pooler (port 5432) is unreachable from at least one dev machine:
# outbound 5432 completes the TCP handshake and then blackholes the payload,
# while 6543 answers normally. GitHub runners have no such filter. Session mode
# is required for DDL, so 6543 is not an option — hence the guard below.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target project"
        required: true
        default: dev
        type: choice
        options: [dev] # prod is added later, with an environment gate

concurrency: db-migrate-${{ inputs.target }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1 # pin the same version the db job uses (ci.yml)

      # The URL never appears on a command line or in an expression inside
      # `run:` — it is passed through the environment and dereferenced by the
      # shell, so it stays out of the process argument list.
      - name: Guard — session pooler only
        env:
          DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          [[ -n "$DB_URL" ]] || { echo "::error::DEV_DB_URL secret is empty or unset"; exit 1; }
          [[ "$DB_URL" == *":5432/postgres"* ]] || { echo "::error::not a session-pooler URL"; exit 1; }
          [[ "$DB_URL" == *"gidodxojpvztrsihnqxj"* ]] || { echo "::error::wrong project ref"; exit 1; }

      - name: Pending migrations
        env:
          DB_URL: ${{ secrets.DEV_DB_URL }}
        run: supabase migration list --db-url "$DB_URL"

      - name: Apply
        env:
          DB_URL: ${{ secrets.DEV_DB_URL }}
        run: supabase migration up --db-url "$DB_URL"

      - name: Confirm
        env:
          DB_URL: ${{ secrets.DEV_DB_URL }}
        run: supabase migration list --db-url "$DB_URL"
